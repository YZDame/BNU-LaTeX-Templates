name: Pages

# Deploys the static site when main is updated.
# actions/configure-pages enablement:true tries to turn Pages on, but the
# action requires a token other than GITHUB_TOKEN (a PAT with repo scope, or
# a GitHub App with administration:write and pages:write). The default
# workflow token cannot create the Pages site. Until a maintainer selects
# Settings > Pages > Build and deployment > Source: GitHub Actions, this
# workflow fails at the configure-pages step.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compile templates
        uses: ./.github/actions/build-templates

      - name: Assemble site
        run: bash scripts/build-site.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
