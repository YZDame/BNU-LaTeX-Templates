name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compile templates
        uses: ./.github/actions/build-templates

      - name: Package zip archives
        run: python3 scripts/package-release.sh

      - name: Attach archives to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bnu-paper.zip
            dist/bnu-cv.zip
            dist/bnu-slides.zip
            dist/bnu-thesis.zip
            dist/bnu-latex-templates.zip
